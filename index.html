<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBoard — управление задачами</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>DevBoard</h1>
    <p>Платформа управления задачами: спринты, релизы, нагрузка</p>
  </header>

  <nav class="app-nav" aria-label="Основная навигация">
    <ul>
      <li><a href="#sprints">Спринты</a></li>
      <li><a href="#releases">Релизы</a></li>
      <li><a href="#team">Команда</a></li>
    </ul>
  </nav>

  <main class="app-main">
    <section id="sprints" aria-labelledby="sprints-title">
      <h2 id="sprints-title">Спринты</h2>
      <ul class="card-list" data-list="sprints"></ul>
    </section>

    <section id="releases" aria-labelledby="releases-title">
      <h2 id="releases-title">Релизы</h2>
      <table class="release-table">
        <caption>Список релизов проекта</caption>
        <thead>
          <tr>
            <th scope="col">Версия</th>
            <th scope="col">Название</th>
            <th scope="col">Статус</th>
            <th scope="col">Дата</th>
            <th scope="col">Окружение</th>
          </tr>
        </thead>
        <tbody data-table="releases"></tbody>
      </table>
    </section>

    <section id="team" aria-labelledby="team-title">
      <h2 id="team-title">Нагрузка команды</h2>
      <ul class="card-list" data-list="team"></ul>
    </section>
  </main>

  <aside class="app-aside" aria-label="Дополнительная панель">
    <h2>Итого</h2>
    <p data-summary="total"></p>
  </aside>

  <footer class="app-footer">
    <address>
      Связь: <a href="mailto:team@devboard.io">team@devboard.io</a>
    </address>
    <p>&copy; 2024 DevBoard</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
